# This is the configuration for a single tile

# REQUIRED: Path to the root directory containing local data
# Data should be organized as: local_data_root/lat/lon/
local_data_root=.\data

# Optional: Mesh settings (adjust based on your needs)
mesh_zl=17
curvature_tol=2

# Optional: Masking settings for water
mask_zl=14
masking_mode=sand
masks_width=100
ratio_water=0.25
use_masks_for_inland=False

# Optional: Texture quality settings
default_zl=17
# Optional: Elevation processing
fill_nodata=True
normal_map_strength=1.0


custom_overlay_src=C:/Program Files (x86)/Steam/steamapps/common/X-Plane 12/Global Scenery/X-Plane 12 Global Scenery

# Optional: Cleaning level (0-3, default 1)
# 0 = keep all temporary files
# 1 = remove imagery files but keep mesh
# 2 = remove most temporary files
# 3 = keep only final DSF/TER files
cleaning_level=3

# Verbosity (0-3)
# 0 = errors only
# 1 = normal
# 2 = debug
# 3 = verbose debug
verbosity=1
